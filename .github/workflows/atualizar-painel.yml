# Atualiza o dados.json do Painel de Marketing a cada 10 minutos e envia para o site.
# Configure os segredos em: GitHub → repositório → Settings → Secrets and variables → Actions.
name: Atualizar painel de marketing

on:
  schedule:
    - cron: "*/10 * * * *"   # o GitHub pode atrasar alguns minutos em horários de pico
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

concurrency:
  group: painel-marketing
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências (só o GA4 usa)
        run: pip install --quiet google-auth requests

      - name: Baixar o dados.json atual (para manter o último dado bom se um canal falhar)
        env:
          DASH_JSON_URL: ${{ secrets.DASH_JSON_URL }}
          DASH_SITE_USER: ${{ secrets.DASH_SITE_USER }}
          DASH_SITE_PASS: ${{ secrets.DASH_SITE_PASS }}
        run: |
          if [ -n "$DASH_JSON_URL" ]; then
            curl -sf --user "$DASH_SITE_USER:$DASH_SITE_PASS" "$DASH_JSON_URL" -o dados.json || rm -f dados.json
          fi

      - name: Coletar dados
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          GADS_DEVELOPER_TOKEN: ${{ secrets.GADS_DEVELOPER_TOKEN }}
          GADS_CLIENT_ID: ${{ secrets.GADS_CLIENT_ID }}
          GADS_CLIENT_SECRET: ${{ secrets.GADS_CLIENT_SECRET }}
          GADS_REFRESH_TOKEN: ${{ secrets.GADS_REFRESH_TOKEN }}
          GADS_CUSTOMER_ID: ${{ secrets.GADS_CUSTOMER_ID }}
          GADS_LOGIN_CUSTOMER_ID: ${{ secrets.GADS_LOGIN_CUSTOMER_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python coletar_dados.py

      - name: Enviar dados.json para o site
        env:
          DASH_UPLOAD_URL: ${{ secrets.DASH_UPLOAD_URL }}     # ex.: ftp://br.jyn5040.com.br/dados.json (FTPS)
          DASH_UPLOAD_USER: ${{ secrets.DASH_UPLOAD_USER }}
          DASH_UPLOAD_PASS: ${{ secrets.DASH_UPLOAD_PASS }}
        run: |
          limpa() { v=$(printf '%s' "$2" | tr -d '\r\n' | sed -e "s/^ *//; s/ *$//; s/^$1=//; s/^[\"']//; s/[\"']$//"); printf '%s' "$v"; }
          URL=$(limpa DASH_UPLOAD_URL "$DASH_UPLOAD_URL")
          USR=$(limpa DASH_UPLOAD_USER "$DASH_UPLOAD_USER")
          PAS=$(limpa DASH_UPLOAD_PASS "$DASH_UPLOAD_PASS")
          echo "Destino: $URL · usuário com ${#USR} caracteres · senha com ${#PAS} caracteres"
          curl -sS --fail --ftp-create-dirs --ssl-reqd --user "$USR:$PAS" -T dados.json "$URL"
          # Páginas fixas da pasta (vão junto, para ficarem sempre iguais às do repositório)
          for f in index.html gerador-utm.html; do curl -sS --fail --ssl-reqd --user "$USR:$PAS" -T "$f" "${URL%/*}/$f"; done
